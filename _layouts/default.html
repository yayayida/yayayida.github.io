<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/IMG_8109.JPG' | absolute_url }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header" aria-label="Site header">
    <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Zhuoyue Zhang home">
      <img class="site-mark__avatar" src="{{ '/assets/img/site-avatar.jpg' | relative_url }}" alt="" aria-hidden="true">
      <span class="site-mark__text">Zhuoyue Zhang</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a {% if page.url == "/" %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
      <a {% if page.url contains "/research/" %}aria-current="page"{% endif %} href="{{ '/research/' | relative_url }}">Research</a>
      <a {% if page.url contains "/projects/" %}aria-current="page"{% endif %} href="{{ '/projects/' | relative_url }}">Projects</a>
      <a {% if page.url contains "/experience/" %}aria-current="page"{% endif %} href="{{ '/experience/' | relative_url }}">Experience</a>
      <a {% if page.url contains "/interests/" %}aria-current="page"{% endif %} href="{{ '/interests/' | relative_url }}">Interests</a>
    </nav>
  </header>

  <main id="content">
    {{ content }}
  </main>

  <p class="quzhou-credit">Quzhou City, Zhejiang, China @OSM</p>

  <footer class="site-footer">
    <span>Zhuoyue Zhang</span>
    <span>Urban mobility, geographic modeling, and human-AI systems</span>
    <span>Last updated: {{ site.time | date: "%B %Y" }}</span>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
