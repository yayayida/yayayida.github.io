<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header" aria-label="Site header">
    <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Zhuoyue Zhang home">
      <span class="site-mark__initials">ZZ</span>
      <span class="site-mark__text">Zhuoyue Zhang</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/research/' | relative_url }}">Research</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/experience/' | relative_url }}">Experience</a>
      <a href="{{ '/interests/' | relative_url }}">Interests</a>
      <a href="{{ '/cv/' | relative_url }}">CV</a>
    </nav>
  </header>

  <main id="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>Zhuoyue Zhang</span>
    <span>Urban mobility, geographic modeling, and human-AI systems</span>
    <span>Last updated: {{ site.time | date: "%B %Y" }}</span>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
